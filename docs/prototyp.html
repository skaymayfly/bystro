document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

utton sc-camel-on-click=\"{{ goLogin }}\" style=\"background:#F3F2EF;color:#161514;border:none;border-radius:999px;padding:12px 20px;font-weight:600;font-size:14px;cursor:pointer\">Přihlásit se<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ goSignup }}\" style=\"background:#C94A2C;color:#fff;border:none;border-radius:999px;padding:12px 20px;font-weight:600;font-size:14px;cursor:pointer\" style-hover=\"background:#161514\">Vyzkoušet zdarma<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:20px\">\n    <div style=\"background:#fff;border-radius:36px;padding:48px 44px;display:flex;flex-direction:column;justify-content:space-between;gap:40px\">\n      <div style=\"display:flex;flex-direction:column;gap:22px\">\n        <div style=\"display:inline-flex;align-self:flex-start;background:#FBE7E0;color:#9E3820;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600\">AI asistent pro podnikatele<\u002Fdiv>\n        <h1 style=\"margin:0;font-size:clamp(40px,5vw,64px);line-height:1.02;font-weight:600;letter-spacing:-0.035em;text-wrap:balance\">Ráno víš, co hoří. A kolik ti zbude na účtu.<\u002Fh1>\n        <p style=\"margin:0;font-size:18px;line-height:1.55;color:#55534E;max-width:520px;text-wrap:pretty\">Bystro propojí e-mail, kalendář, faktury, banku a CRM. Každé ráno ti řekne, co je důležité, a hlídá, aby ti nedošly peníze.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n          <button sc-camel-on-click=\"{{ goSignup }}\" style=\"background:#C94A2C;color:#fff;border:none;border-radius:999px;padding:18px 28px;font-weight:600;font-size:16px;cursor:pointer;display:flex;gap:12px;align-items:center\" style-hover=\"background:#161514\">Vyzkoušet 30 dní zdarma <span>→<\u002Fspan><\u002Fbutton>\n          <button sc-camel-on-click=\"{{ goDash }}\" style=\"background:#F3F2EF;color:#161514;border:none;border-radius:999px;padding:18px 24px;font-weight:600;font-size:16px;cursor:pointer\">Ukázkový účet<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"font-size:13px;color:#6B6964\">Bez platební karty. Nastavení zabere asi 3 minuty.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#161514;border-radius:36px;padding:32px;display:flex;flex-direction:column;gap:14px;justify-content:flex-end;min-height:480px\">\n      <div style=\"font-size:13px;color:#A8A49D\">Dnes 7:00 · Ranní přehled<\u002Fdiv>\n      <div style=\"background:#fff;border-radius:24px 24px 24px 6px;padding:22px;font-size:19px;line-height:1.45;font-weight:500;max-width:440px\">Dobré ráno, Petře. Těmto <span style=\"color:#C94A2C\">3 klientům<\u002Fspan> je potřeba odpovědět, <span style=\"color:#C94A2C\">2 faktury<\u002Fspan> jsou po splatnosti a dnes máš <span style=\"color:#C94A2C\">4 schůzky<\u002Fspan>.<\u002Fdiv>\n      <div style=\"align-self:flex-end;background:#C94A2C;color:#fff;border-radius:24px 24px 6px 24px;padding:14px 18px;font-size:16px\">Kolik jsem vydělal minulý měsíc?<\u002Fdiv>\n      <div style=\"background:#2A2826;color:#F3F2EF;border-radius:24px 24px 24px 6px;padding:18px 20px;font-size:16px;line-height:1.5;max-width:440px\">V září ti po odečtení nákladů zůstalo <b style=\"color:#fff\">158 400 Kč<\u002Fb>. To je o 8 % víc než v srpnu.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:20px\">\n    <div style=\"background:#fff;border-radius:28px;padding:28px;display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font-size:13px;color:#6B6964;font-weight:600\">01<\u002Fdiv>\n      <div style=\"font-size:22px;font-weight:600;letter-spacing:-0.01em\">Ranní přehled<\u002Fdiv>\n      <div style=\"font-size:15px;line-height:1.55;color:#55534E\">Komu odpovědět, co je po splatnosti a kam dnes jedeš. Jedna zpráva místo pěti aplikací.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border-radius:28px;padding:28px;display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font-size:13px;color:#6B6964;font-weight:600\">02<\u002Fdiv>\n      <div style=\"font-size:22px;font-weight:600;letter-spacing:-0.01em\">Ptej se normálně česky<\u002Fdiv>\n      <div style=\"font-size:15px;line-height:1.55;color:#55534E\">„Kdo mi dluží?“ „Zvládnu zaplatit DPH?“ Odpověď dostaneš z tvých vlastních dat, ne z tabulek.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border-radius:28px;padding:28px;display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font-size:13px;color:#6B6964;font-weight:600\">03<\u002Fdiv>\n      <div style=\"font-size:22px;font-weight:600;letter-spacing:-0.01em\">Hlídač peněz<\u002Fdiv>\n      <div style=\"font-size:15px;line-height:1.55;color:#55534E\">Propojí banku s fakturami a předpoví cash-flow na 30, 60 a 90 dní. Varuje dřív, než je pozdě.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#C94A2C;color:#fff;border-radius:36px;padding:48px 44px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:32px;align-items:end\">\n    <div style=\"font-size:clamp(28px,3.4vw,42px);line-height:1.15;font-weight:500;letter-spacing:-0.02em;text-wrap:balance\">„Pokud nezaplatí Novák s.r.o., za 18 dní ti může chybět 74 000 Kč.“<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:18px\">\n      <div style=\"font-size:17px;line-height:1.55\">Takhle vypadá upozornění od Hlídače peněz. Rovnou ti navrhne připomínku pro klienta, kterou odešleš jedním klikem.<\u002Fdiv>\n      <button sc-camel-on-click=\"{{ goSignup }}\" style=\"align-self:flex-start;background:#fff;color:#161514;border:none;border-radius:999px;padding:16px 24px;font-weight:600;font-size:15px;cursor:pointer\">Chci hlídat svoje peníze<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;ju t-size:15px;cursor:pointer\">Pokračovat přes Google<\u002Fbutton>\n      <div style=\"display:flex;align-items:center;gap:12px;color:#8A877F;font-size:13px\"><div style=\"flex:1;height:1px;background:#E6E4DF\"><\u002Fdiv>nebo e-mailem<div style=\"flex:1;height:1px;background:#E6E4DF\"><\u002Fdiv><\u002Fdiv>\n      <sc-if value=\"{{ isSignup }}\" hint-placeholder-val=\"{{ true }}\">\n        <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#55534E\">Jméno a příjmení<input placeholder=\"Petr Dvořák\" style=\"border:1px solid #E6E4DF;border-radius:16px;padding:15px 16px;font-size:15px;outline:none;background:#FAFAF8\"><\u002Flabel>\n      <\u002Fsc-if>\n      <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#55534E\">E-mail<input placeholder=\"petr@dvorak-interiery.cz\" style=\"border:1px solid #E6E4DF;border-radius:16px;padding:15px 16px;font-size:15px;outline:none;background:#FAFAF8\"><\u002Flabel>\n      <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#55534E\">Heslo<input type=\"password\" placeholder=\"Aspoň 8 znaků\" style=\"border:1px solid #E6E4DF;border-radius:16px;padding:15px 16px;font-size:15px;outline:none;background:#FAFAF8\"><\u002Flabel>\n      <button sc-camel-on-click=\"{{ authSubmit }}\" style=\"background:#C94A2C;color:#fff;border:none;border-radius:999px;padding:17px;font-weight:600;font-size:15px;cursor:pointer\" style-hover=\"background:#161514\">{{ authCta }}<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"font-size:13px;color:#8A877F;text-align:center\">Tvoje data šifrujeme a nikdy je neprodáváme.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"background:#161514;border-radius:36px;padding:40px;display:flex;flex-direction:column;justify-content:flex-end;gap:16px;min-height:420px\">\n    <div style=\"font-size:13px;color:#A8A49D\">Co tě čeká zítra v 7:00<\u002Fdiv>\n    <div style=\"color:#fff;font-size:clamp(26px,2.6vw,36px);line-height:1.2;font-weight:500;letter-spacing:-0.02em;max-width:520px;text-wrap:pretty\">„3 klientům je potřeba odpovědět, 2 faktury jsou po splatnosti a dnes máš 4 schůzky.“<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isOnb }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Onboarding\" style=\"min-height:100vh;padding:24px;display:flex;flex-direction:column;align-items:center;gap:24px\">\n  <div style=\"width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center\">\n    <div style=\"display:flex;align-items:center;gap:10px\">\n      <div style=\"width:36px;height:36px;border-radius:50%;background:#161514;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px\">B<\u002Fdiv>\n      <div style=\"font-weight:600;font-size:18px\">Bystro<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:6px\">\n      <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"3\">\n        <div style=\"width:{{ s.w }}px;height:8px;border-radius:99px;background:{{ s.bg }};transition:all .3s\"><\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"width:100%;max-width:760px;background:#fff;border-radius:36px;padding:44px;display:flex;flex-direction:column;gap:28px;animation:bzIn .35s ease\">\n    <sc-if value=\"{{ step1 }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <div style=\"font-size:13px;color:#6B6964;font-weight:600\">Krok 1 ze 3<\u002Fdiv>\n        <h2 style=\"margin:0;font-size:36px;font-weight:600;letter-spacing:-0.02em\">Ahoj! Jak se jmenuje tvoje firma?<\u002Fh2>\n        <div style=\"font-size:16px;color:#55534E;line-height:1.5\">Podle IČO si dohledám základní údaje, ať je nemusíš vypisovat.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px\">\n        <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#55534E\">Název firmy<input value=\"{{ company }}\" sc-camel-on-change=\"{{ onCompany }}\" style=\"border:1px solid #E6E4DF;border-radius:16px;padding:15px 16px;font-size:15px;outline:none;background:#FAFAF8\"><\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#55534E\">IČO<input placeholder=\"08123456\" style=\"border:1px solid #E6E4DF;border-radius:16px;padding:15px 16px;font-size:15px;outline:none;background:#FAFAF8\"><\u002Flabel>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ step2 }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <div style=\"font-size:13px;color:#6B6964;font-weight:600\">Krok 2 ze 3<\u002Fdiv>\n        <h2 style=\"margin:0;font-size:36px;font-weight:600;letter-spacing:-0.02em\">Co mám propojit?<\u002Fh2>\n        <div style=\"font-size:16px;color:#55534E;line-height:1.5\">Čím víc toho propojíš, tím přesnější bude ranní přehled. Kdykoliv to změníš v nastavení.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <sc-for list=\"{{ integrations }}\" as=\"it\" hint-placeholder-count=\"5\">\n          <div sc-camel-on-click=\"{{ it.toggle }}\" style=\"display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:20px;background:{{ it.rowBg }};cursor:pointer;transition:background .2s\">\n            <div style=\"width:44px;height:44px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px\">{{ it.short }}<\u002Fdiv>\n            <div style=\"flex:1;min-width:0\"><div style=\"font-weight:600;font-size:16px\">{{ it.name }}<\u002Fdiv><div style=\"font-size:13px;color:#6B6964\">{{ it.desc }}<\u002Fdiv><\u002Fdiv>\n            <div style=\"font-size:13px;font-weight:600;color:{{ .), Lenka Horáková 9 800 Kč (8. 10.); výdaje: mzdy 84 400 Kč (9. 10.), nájem 38 000 Kč, DPH 41 200 Kč (25. 10.), dřevo 96 000 Kč (26. 10.). Pokud Novák nezaplatí, kolem 23. 10. bude chybět 74 000 Kč. Schůzky dnes: 9:30 Horáková, 11:00 Stavby Kříž, 14:00 účetní, 16:30 Zelený dům.';\nconst SUGG = ['Kolik jsem vydělal minulý měsíc?','Kdo mi dluží peníze?','Zvládnu zaplatit DPH?','Co mě dnes čeká?'];\nconst genDraft = (inv, soft) => soft\n  ? `Dobrý den, ${inv.contact.split(' ')[0] === 'Jan' ? 'pane Nováku' : inv.contact},\\n\\njen drobnost — nevím, jestli k vám dorazila faktura ${inv.id} na ${fmt(inv.amount)}. Kdyby bylo potřeba ji poslat znovu, dejte vědět.\\n\\nHezký den,\\nPetr Dvořák`\n  : `Dobrý den, ${inv.contact.split(' ')[0] === 'Jan' ? 'pane Nováku' : inv.contact},\\n\\nchci se připomenout ohledně faktury ${inv.id} na ${fmt(inv.amount)}, která byla splatná ${inv.due}. Kdyby se platba někde zasekla, dejte mi prosím vědět — rád pomůžu najít řešení.\\n\\nDíky a hezký den,\\nPetr Dvořák`;\n\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    const c = !(props.emptyData ?? false);\n    this.state = { screen: props.startScreen ?? 'landing', authMode:'signup', step:1, company:'Dvořák Interiéry s.r.o.',\n      conn:{email:c,cal:c,bank:c,inv:c,crm:false}, horizon: props.horizon ?? 30, scenario:'unpaid', filter:'all', invId:'FV-2026-0142',\n      msgs:[], input:'', thinking:false, sent:{}, done:{}, drafts:{}, soft:{}, toast:'', brief:'7:00', channel:'Aplikace', threshold:50000 };\n  }\n  componentDidUpdate(prev) {\n    if (prev.startScreen !== this.props.startScreen && this.props.startScreen) this.setState({screen:this.props.startScreen});\n    if (prev.emptyData !== this.props.emptyData) { const c = !this.props.emptyData; this.setState({conn:{email:c,cal:c,bank:c,inv:c,crm:false}}); }\n    if (prev.horizon !== this.props.horizon && this.props.horizon) this.setState({horizon:this.props.horizon});\n  }\n  go(s, extra) { this.setState({screen:s, ...(extra||{})}); window.scrollTo(0,0); }\n  flash(t) { this.setState({toast:t}); clearTimeout(this._t); this._t = setTimeout(()=>this.setState({toast:''}), 2600); }\n  setConn(k, v) { this.setState(s => ({conn:{...s.conn,[k]:v}})); }\n  async answer(q) {\n    const low = q.toLowerCase();\n    if (low.startsWith('navrhni odpověď')) { const r = REPLIES.find(x => low.includes(x.name.toLowerCase())); await new Promise(r=>setTimeout(r,700)); return r ? r.draft : 'Komu mám odpověď navrhnout?'; }\n    const c = CANNED.find(x => x.a && x.k.some(k => low.includes(k)));\n    if (c) { await new Promise(r=>setTimeout(r,800)); return c.a; }\n    try { if (window.claude && window.claude.complete) { const r = await window.claude.complete(CONTEXT + '\\n\\nOtázka uživatele: ' + q); if (r) return String(r).trim(); } } catch(e) {}\n    return 'Na tohle zatím nemám dost dat. Zkus se zeptat na příjmy, faktury, cash-flow nebo dnešní schůzky.';\n  }\n  async send(q) {\n    q = (q || '').trim(); if (!q || this.state.thinking) return;\n    this.setState(s => ({msgs:[...s.msgs,{role:'user',text:q}], input:'', thinking:true, screen:'chat'}));\n    const a = await this.answer(q);\n    this.setState(s => ({msgs:[...s.msgs,{role:'bot',text:a}], thinking:false}));\n  }\n  renderVals() {\n    const s = this.state, sc = s.screen;\n    const appScreens = ['dash','chat','cash','inv','detail','settings'];\n    const navKey = sc === 'detail' ? 'inv' : sc;\n    const nav = [{k:'dash',l:'Přehled'},{k:'chat',l:'Asistent'},{k:'cash',l:'Hlídač peněz'},{k:'inv',l:'Faktury',b:s.conn.inv ? String(INV.filter(i=>i.status==='overdue' && !s.sent[i.id]).length || '') : ''},{k:'settings',l:'Nastavení'}]\n      .map(n => ({label:n.l, badge:n.b || false, go:()=>this.go(n.k), bg: navKey===n.k ? '#fff' : 'transparent', fg: navKey===n.k ? '#161514' : '#55534E', dot: navKey===n.k ? '#C94A2C' : '#CFCBC4'}));\n\n    const left = REPLIES.filter(r => !s.done[r.id]).length;\n    const briefLine1 = !s.conn.email ? 'E-mail nvRaw);\n    inv.advice = invRaw.id === 'FV-2026-0142' ? 'Jan Novák fakturu otevřel 22. 9., ale neodpověděl. Pošli mu přátelskou připomínku — jeho firma platí obvykle do týdne po upomínce.' : `${invRaw.client} platí většinou pár dní po splatnosti. Stačí krátká připomínka.`;\n    inv.okTitle = invRaw.status === 'paid' ? `Zaplaceno ${invRaw.paid}` : 'Zatím je vše v pořádku';\n    inv.okText = invRaw.status === 'paid' ? 'Platba dorazila na účet a spárovala jsem ji s fakturou. Není potřeba nic dělat.' : `Splatnost je ${invRaw.due}. Kdyby platba nedorazila, ozvu se ti ráno v přehledu.`;\n    const tl = [{title:'Vystaveno',date:invRaw.issued},{title:'Odesláno e-mailem',date:invRaw.issued},{title:'Splatnost',date:invRaw.due}];\n    if (invRaw.status==='paid') tl.push({title:'Zaplaceno',date:invRaw.paid,ok:true});\n    if (invRaw.status==='overdue') tl.splice(2,0,{title:'Otevřeno klientem',date:'22. 9. 2026'}), tl.push({title:`${invRaw.days} dní po splatnosti`,date:'dnes',bad:true});\n    if (s.sent[invRaw.id]) tl.push({title:'Připomínka odeslána',date:'dnes',ok:true});\n    const timeline = tl.map(t => ({...t, dot: t.bad ? '#C94A2C' : t.ok ? '#2F8F5B' : '#161514', fg: t.bad ? '#9E3820' : '#161514'}));\n\n    const INTS = [{k:'email',short:'@',name:'E-mail',desc:'Gmail, Outlook, Seznam'},{k:'cal',short:'31',name:'Kalendář',desc:'Google, Outlook'},{k:'bank',short:'Kč',name:'Banka',desc:'Fio, ČSOB, KB, Air Bank a další'},{k:'inv',short:'FV',name:'Fakturace',desc:'Fakturoid, iDoklad, Pohoda'},{k:'crm',short:'CRM',name:'CRM',desc:'Pipedrive, Raynet, HubSpot'}];\n    const integrations = INTS.map(it => { const on = s.conn[it.k]; return {...it, toggle:()=>this.setConn(it.k,!on), rowBg: on ? '#FBE7E0' : '#F7F6F3', track: on ? '#C94A2C' : '#D9D6D0', knob: on ? 21 : 3, stateLabel: on ? 'Propojeno' : 'Připojit', stateFg: on ? '#9E3820' : '#6B6964'}; });\n    const pill = (on, alt) => ({bg: on ? (alt ? '#161514' : '#161514') : (alt ? '#F3F2EF' : '#F3F2EF'), fg: on ? '#fff' : '#161514'});\n\n    return {\n      isLanding: sc==='landing', isAuth: sc==='auth', isOnb: sc==='onboarding', isApp: appScreens.includes(sc),\n      isDash: sc==='dash', isChat: sc==='chat', isCash: sc==='cash', isInv: sc==='inv', isDetail: sc==='detail', isSettings: sc==='settings',\n      goLanding:()=>this.go('landing'), goSignup:()=>this.go('auth',{authMode:'signup'}), goLogin:()=>this.go('auth',{authMode:'login'}),\n      goDash:()=>this.go('dash'), goCash:()=>this.go('cash'), goInv:()=>this.go('inv'),\n      openNovak:()=>this.go('detail',{invId:'FV-2026-0142'}),\n      isSignup: s.authMode==='signup', signupTabBg: s.authMode==='signup' ? '#fff' : 'transparent', loginTabBg: s.authMode==='login' ? '#fff' : 'transparent',\n      setSignup:()=>this.setState({authMode:'signup'}), setLogin:()=>this.setState({authMode:'login'}),\n      authTitle: s.authMode==='signup' ? 'Začni zdarma na 30 dní' : 'Vítej zpátky', authCta: s.authMode==='signup' ? 'Vytvořit účet' : 'Přihlásit se',\n      authSubmit:()=> s.authMode==='signup' ? this.go('onboarding',{step:1,conn:{email:false,cal:false,bank:false,inv:false,crm:false}}) : this.go('dash'),\n      steps:[1,2,3].map(n=>({w: n===s.step ? 32 : 8, bg: n<=s.step ? '#C94A2C' : '#D9D6D0'})),\n      step1:s.step===1, step2:s.step===2, step3:s.step===3, company:s.company, onCompany:e=>this.setState({company:e.target.value}),\n      onbBack:()=> s.step===1 ? this.go('auth') : this.setState({step:s.step-1}),\n      onbNext:()=> s.step<3 ? this.setState({step:s.step+1}) : (this.go('dash'), this.flash(`Hotovo. První ranní přehled dorazí zítra v ${s.brief}.`)),\n      onbCta: s.step===3 ? 'Začít používat' : s.step===2 ? (Object.values(s.conn).some(Boolean) ? 'Pokračovat' : 'Teď přeskočit') : 'Pokračovat',\n      integrations,\n      briefTimes:['6:30','7:00','8:00'].map(t=>({label:t, pick:()=>this.setState({brief:t}), ...pill(s.brief===t)})),\n      channels:['E-mail','Aplikace','SMS'].map(c=>({label:c, pick:()=>this.setState({channel:c}), ...pill(s.channel===c)})),\n      thresholds:[0,50000,100000].map(t=>({label:fmt(t), pick:()=>this.setState({threshold:t}), ...pill(s.threshold===t)})),\n      nav,\n      briefLine1, briefOverdue: !s.conn.inv ? 'faktury nevidím' : ovLeft===0 ? 'faktury jsou v pořádku' : ovLeft===1 ? '1 faktura je po splatnosti' : `${ovLeft} faktury jsou po splatnosti`, briefLine2:'a dnes máš',\n      input:s.input, onInput:e=>this.setState({input:e.target.value}), onKey:e=>{ if (e.key==='Enter') this.send(s.input); }, sendInput:()=>this.send(s.input),\n      suggestions: SUGG.map(q=>({label:q, ask:()=>this.send(q)})),\n      hasEmail:s.conn.email, noEmail:!s.conn.email, hasInv:s.conn.inv, noInv:!s.conn.inv, hasBank:s.conn.bank, noBank:!s.conn.bank,\n      connEmail:()=>{this.setConn('email',true); this.flash('E-mail propojen.');}, connInv:()=>{this.setConn('inv',true); this.flash('Fakturace propojena. Načteno 8 faktur.');}, connBank:()=>{this.setConn('bank',true); this.flash('Banka propojena jen pro čtení.');},\n      replyLeft: s.conn.email ? `${left} ze 3` : '',\n      replies: REPLIES.map(r => { const d = !!s.done[r.id]; return {...r, opacity: d ? .5 : 1, deco: d ? 'line-through' : 'none', check: d ? '✓' : '', checkBg: d ? '#2F8F5B' : 'transparent', checkBorder: d ? '#2F8F5B' : '#CFCBC4',\n        toggle:()=>this.setState(st=>({done:{...st.done,[r.id]:!d}})), draft:()=>this.send(`Navrhni odpověď pro ${r.name}`)}; }),\n      overdueTotal: s.conn.inv ? fmt(overdueList.reduce((a,i)=>a+i.amount,0)) : '',\n      overdue: overdueList.map(i => ({...i, amountFmt:fmt(i.amount), daysLabel:`${i.days} dní`, cta: s.sent[i.id] ? 'Připomínka odeslána ✓' : 'Připomenout →', ctaFg: s.sent[i.id] ? '#226B43' : '#C94A2C', open:()=>this.go('detail',{invId:i.id})})),\n      meetings: MEETINGS.map((m,i)=>({...m, timeFg: i===0 ? '#E8A08C' : '#fff'})),\n      horizons:[30,60,90].map(h=>({label:`${h} dní`, pick:()=>this.setState({horizon:h}), bg: s.horizon===h ? '#fff' : 'transparent', fg:'#161514', bgAlt: s.horizon===h ? '#161514' : 'transparent', fgAlt: s.horizon===h ? '#fff' : '#161514'})),\n      scenarios:[{k:'unpaid',l:'Novák nezaplatí'},{k:'paid',l:'Novák zaplatí do 20. 10.'}].map(x=>({label:x.l, pick:()=>this.setState({scenario:x.k}), ...pill(s.scenario===x.k)})),\n      bars, alertText, isUnpaid: unpaid, alertBg: unpaid ? '#FBE7E0' : '#E3F1E8', alertFg: unpaid ? '#7A2A16' : '#1D5C39', alertDot: unpaid ? '#C94A2C' : '#2F8F5B',\n      minFmt: fmt(minV), minFg: minV < 0 ? '#C94A2C' : '#161514', minDate: `týden od ${DATES[minI]}`, endLabel: `Za ${s.horizon} dní`, endFmt: fmt(endV),\n      flows: FLOWS.map(f=>({...f, amount:(f.amount>0?'+':'')+fmt(f.amount), fg: f.amount>0 ? (f.title.includes('nejisté') ? '#8A5A00' : '#226B43') : '#161514'})),\n      invSummary: s.conn.inv ? `${INV.length} faktur · ${fmt(INV.filter(i=>i.status!=='paid').reduce((a,i)=>a+i.amount,0))} čeká na zaplacení` : 'Fakturace není propojená',\n      filters:[{k:'all',l:'Vše'},{k:'overdue',l:'Po splatnosti'},{k:'pending',l:'Čeká'},{k:'paid',l:'Zaplaceno'}].map(f=>({label:f.l, pick:()=>this.setState({filter:f.k}), bg: s.filter===f.k ? '#161514' : 'transparent', fg: s.filter===f.k ? '#fff' : '#161514'})),\n      invRows: rows, noRows: rows.length===0,\n      inv, timeline, invOverdue: invRaw.status==='overdue', invOk: invRaw.status!=='overdue',\n      isSent: !!s.sent[invRaw.id], notSent: !s.sent[invRaw.id],\n      draft: s.drafts[invRaw.id] ?? genDraft(invRaw, s.soft[invRaw.id]), onDraft:e=>this.setState(st=>({drafts:{...st.drafts,[invRaw.id]:e.target.value}})),\n      toneCta: s.soft[invRaw.id] ? 'Formálnější tón' : 'Jemnější tón',\n      softer:()=>this.setState(st=>{ const d = {...st.drafts}; delete d[invRaw.id]; return {soft:{...st.soft,[invRaw.id]:!st.soft[invRaw.id]}, drafts:d}; }),\n      sendReminder:()=>{ this.setState(st=>({sent:{...st.sent,[invRaw.id]:true}})); this.flash(`Připomínka pro ${invRaw.client} odeslána.`); },\n      msgs: s.msgs.map(m=>({text:m.text, isUser:m.role==='user', isBot:m.role==='bot'})), hasMsgs: s.msgs.length>0, noMsgs: s.msgs.length===0 && !s.thinking, thinking:s.thinking,\n      clearChat:()=>this.setState({msgs:[]}),\n      toast:s.toast, hasToast:!!s.toast\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
