<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Bystrouš v aplikaci</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
.masc{display:block;overflow:visible}
.masc *{transform-box:fill-box}
.masc .ink{fill:#111}
.masc .wh{fill:#fff}
.masc .gr{fill:#16a34a}
.masc .gy{fill:#a1a1aa}
.masc .rd{fill:#dc2626}
.masc .ln{stroke:#111;stroke-width:13;stroke-linecap:round;stroke-linejoin:round;fill:none}
.masc .mo{stroke:#fff;stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.masc .bx{stroke:#fff;stroke-width:4.5;stroke-linecap:round;fill:none}
.masc .zl{stroke:#a1a1aa;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none}
.masc .alt,.masc .fx>g{display:none}
.masc .sh{fill:#111;opacity:.1;transform-origin:50% 50%;animation:m-sh 3.2s ease-in-out infinite}
.masc .all,.masc .bd{transform-origin:50% 100%}
.masc .armL{transform-origin:100% 0}
.masc .armR{transform-origin:0 0}
.masc .tuft{transform-origin:0 100%;animation:m-tuft 3.2s ease-in-out infinite}
.masc .bd{animation:m-breath 3.2s ease-in-out infinite}
.masc .eye{transform-origin:50% 50%;animation:m-blink 4.6s infinite}
.masc .sp,.masc .dt,.masc .bdg{transform-origin:50% 50%}
@keyframes m-breath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
@keyframes m-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes m-tuft{0%,100%{transform:rotate(0)}50%{transform:rotate(8deg)}}
@keyframes m-sh{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.04)}}
.m-wave .mo-smile,.m-joy .mo-smile,.m-think .mo-smile,.m-alert .mo-smile,.m-sleep .mo-smile{display:none}
.masc.m-wave .mo-open,.masc.m-joy .mo-open{display:block}
.masc.m-joy .eyes,.masc.m-sleep .eyes{display:none}
.masc.m-joy .arc-up,.masc.m-sleep .arc-dn{display:block}
.masc.m-think .mo-o,.masc.m-sleep .mo-o,.masc.m-alert .mo-flat{display:block}
.masc.m-joy .fx-spark,.masc.m-think .fx-dots,.masc.m-alert .fx-badge,.masc.m-sleep .fx-zz{display:block}
.m-wave .armR{animation:m-wave .5s ease-in-out infinite alternate}
@keyframes m-wave{from{transform:rotate(-92deg)}to{transform:rotate(-128deg)}}
.m-joy .all{animation:m-jump 1.1s cubic-bezier(.3,0,.3,1) infinite}
.m-joy .armL{transform:rotate(95deg)}
.m-joy .armR{transform:rotate(-95deg)}
.masc.m-joy .sh{animation:m-shj 1.1s infinite}
.m-joy .sp{animation:m-pop 1.1s infinite}
.m-joy .sp2{animation-delay:.25s}
.m-joy .sp3{animation-delay:.5s}
@keyframes m-jump{0%,78%,100%{transform:translateY(0) scale(1)}12%{transform:translateY(0) scale(1.07,.9)}40%{transform:translateY(-26px) scale(.95,1.06)}62%{transform:translateY(0) scale(1.06,.92)}}
@keyframes m-shj{0%,12%,62%,100%{transform:scaleX(1);opacity:.1}40%{transform:scaleX(.7);opacity:.05}}
@keyframes m-pop{0%,70%,100%{transform:scale(0) rotate(0)}35%{transform:scale(1) rotate(45deg)}}
.masc.m-think .bd{animation:m-tilt 2.6s ease-in-out infinite}
.masc.m-think .eye{animation:none}
.m-think .pp{animation:m-look 2.6s ease-in-out infinite}
.m-think .dt{animation:m-dot 1.5s infinite}
.m-think .d2{animation-delay:.2s}
.m-think .d3{animation-delay:.4s}
@keyframes m-tilt{0%,100%{transform:rotate(3deg)}50%{transform:rotate(5deg)}}
@keyframes m-look{0%,100%{transform:translate(4px,-7px)}50%{transform:translate(1px,-8px)}}
@keyframes m-dot{0%,100%{transform:scale(.5);opacity:.3}40%{transform:scale(1);opacity:1}}
.masc.m-alert .eye{animation:none;transform:scale(1.1)}
.m-alert .pp{animation:m-dart 2.4s infinite}
.masc.m-alert .tuft{animation:m-jit .25s infinite alternate}
.m-alert .armR{transform:rotate(-95deg)}
.m-alert .bdg{animation:m-pulse 1.2s ease-in-out infinite}
@keyframes m-dart{0%,40%,100%{transform:translateX(-6px)}50%,90%{transform:translateX(4px)}}
@keyframes m-jit{from{transform:rotate(-22deg)}to{transform:rotate(-16deg)}}
@keyframes m-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.masc.m-sleep .bd{animation:m-snore 4.4s ease-in-out infinite}
.masc.m-sleep .tuft{animation:none;transform:rotate(40deg)}
.m-sleep .zz{opacity:0;animation:m-zz 3s linear infinite}
.m-sleep .z2{animation-delay:1s}
.m-sleep .z3{animation-delay:2s}
@keyframes m-snore{0%,100%{transform:scale(1,1)}50%{transform:scale(1.05,.95)}}
@keyframes m-zz{0%{transform:translate(0,0) scale(.6);opacity:0}20%,80%{opacity:1}100%{transform:translate(14px,-30px) scale(1.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.masc *{animation:none!important}}
</style>
</helmet>
<div style="width: 1200px; height: 640px; box-sizing: border-box; padding: 48px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; background: #fafafa; font-family: 'Geist', sans-serif; color: #111111">
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="font-size: 14px; font-weight: 500; color: #71717a">Ranní přehled · 88 px</div>
<div style="flex-grow: 1; background: #ffffff; border: 1px solid #e4e4e7; border-radius: 28px; padding: 24px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; gap: 14px">
<svg class="masc m-wave" viewBox="0 0 200 220" role="img" aria-label="Bystrouš mává" style="width: 88px; height: 97px; flex-shrink: 0">
<ellipse class="sh" cx="100" cy="205" rx="50" ry="6"></ellipse>
<g class="all">
<path class="ln" d="M80 166V195H71"></path>
<path class="ln" d="M120 166V195H129"></path>
<g class="armL"><line class="ln" x1="46" y1="118" x2="24" y2="138"></line></g>
<g class="armR"><line class="ln" x1="154" y1="118" x2="176" y2="138"></line></g>
<g class="bd">
<line class="ln tuft" x1="100" y1="56" x2="111" y2="31"></line>
<rect class="ink" x="40" y="52" width="120" height="118" rx="32"></rect>
<g class="eyes">
<g class="eye"><ellipse class="wh" cx="78" cy="98" rx="15" ry="18"></ellipse><g class="pp"><circle class="ink" cx="81" cy="100" r="7.5"></circle><circle class="wh" cx="84" cy="96.5" r="2.5"></circle></g></g>
<g class="eye"><ellipse class="wh" cx="122" cy="98" rx="15" ry="18"></ellipse><g class="pp"><circle class="ink" cx="125" cy="100" r="7.5"></circle><circle class="wh" cx="128" cy="96.5" r="2.5"></circle></g></g>
</g>
<path class="mo mo-smile" d="M89 128Q100 138 111 128"></path>
<path class="wh alt mo-open" d="M87 125H113Q113 142 100 142Q87 142 87 125Z"></path>
</g>
</g>
</svg>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 22px; font-weight: 600; letter-spacing: -0.5px">Dobré ráno</div>
<div style="font-size: 15px; color: #52525b">Dnes na tebe čekají dvě věci.</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="background: #f4f4f5; border-radius: 16px; padding: 16px; display: flex; align-items: center; gap: 12px; font-size: 16px">
<div style="width: 9px; height: 9px; border-radius: 50%; background: #dc2626; flex-shrink: 0"></div>
<div style="flex-grow: 1">Novák s.r.o. po splatnosti</div>
<div style="font-weight: 600">48 200 Kč</div>
</div>
<div style="background: #f4f4f5; border-radius: 16px; padding: 16px; display: flex; align-items: center; gap: 12px; font-size: 16px">
<div style="width: 9px; height: 9px; border-radius: 50%; background: #111111; flex-shrink: 0"></div>
<div style="flex-grow: 1">E-mail od Lenky Horákové</div>
</div>
</div>
<button type="button" style="margin-top: auto; min-height: 48px; border: 0; border-radius: 999px; background: #111111; color: #ffffff; font: 500 16px 'Geist', sans-serif; cursor: pointer">Pojďme na to</button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="font-size: 14px; font-weight: 500; color: #71717a">Prázdný stav · 160 px</div>
<div style="flex-grow: 1; background: #ffffff; border: 1px solid #e4e4e7; border-radius: 28px; padding: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center">
<svg class="masc m-sleep" viewBox="0 0 200 220" role="img" aria-label="Bystrouš spí" style="width: 160px; height: 176px">
<ellipse class="sh" cx="100" cy="205" rx="50" ry="6"></ellipse>
<g class="all">
<path class="ln" d="M80 166V195H71"></path>
<path class="ln" d="M120 166V195H129"></path>
<g class="armL"><line class="ln" x1="46" y1="118" x2="24" y2="138"></line></g>
<g class="armR"><line class="ln" x1="154" y1="118" x2="176" y2="138"></line></g>
<g class="bd">
<line class="ln tuft" x1="100" y1="56" x2="111" y2="31"></line>
<rect class="ink" x="40" y="52" width="120" height="118" rx="32"></rect>
<path class="mo alt arc-dn" d="M66 97Q78 109 90 97M110 97Q122 109 134 97"></path>
<ellipse class="mo alt mo-o" cx="100" cy="132" rx="5" ry="6"></ellipse>
</g>
</g>
<g class="fx" aria-hidden="true">
<g class="fx-zz">
<g transform="translate(150 40)"><path class="zl zz" d="M0 0H9L0 10H9"></path></g>
<g transform="translate(150 40)"><path class="zl zz z2" d="M0 0H9L0 10H9"></path></g>
<g transform="translate(150 40)"><path class="zl zz z3" d="M0 0H9L0 10H9"></path></g>
</g>
</g>
</svg>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 22px; font-weight: 600; letter-spacing: -0.5px">Žádné faktury po splatnosti</div>
<div style="font-size: 15px; line-height: 1.45; color: #52525b">Hlídám dál. Ozvu se, kdyby se něco změnilo.</div>
</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="font-size: 14px; font-weight: 500; color: #71717a">Oznámení · 56 px</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{rows}}" as="item" hint-placeholder-count="3">
<div style="flex-grow: 1; background: #ffffff; border: 1px solid #e4e4e7; border-radius: 24px; padding: 16px 20px; display: flex; align-items: center; gap: 16px">
<svg class="masc {{item.cls}}" viewBox="0 0 200 220" role="img" aria-label="{{item.aria}}" style="width: 56px; height: 62px; flex-shrink: 0">
<ellipse class="sh" cx="100" cy="205" rx="50" ry="6"></ellipse>
<g class="all">
<path class="ln" d="M80 166V195H71"></path>
<path class="ln" d="M120 166V195H129"></path>
<g class="armL"><line class="ln" x1="46" y1="118" x2="24" y2="138"></line></g>
<g class="armR"><line class="ln" x1="154" y1="118" x2="176" y2="138"></line></g>
<g class="bd">
<line class="ln tuft" x1="100" y1="56" x2="111" y2="31"></line>
<rect class="ink" x="40" y="52" width="120" height="118" rx="32"></rect>
<g class="eyes">
<g class="eye"><ellipse class="wh" cx="78" cy="98" rx="15" ry="18"></ellipse><g class="pp"><circle class="ink" cx="81" cy="100" r="7.5"></circle><circle class="wh" cx="84" cy="96.5" r="2.5"></circle></g></g>
<g class="eye"><ellipse class="wh" cx="122" cy="98" rx="15" ry="18"></ellipse><g class="pp"><circle class="ink" cx="125" cy="100" r="7.5"></circle><circle class="wh" cx="128" cy="96.5" r="2.5"></circle></g></g>
</g>
<path class="mo alt arc-up" d="M66 101Q78 85 90 101M110 101Q122 85 134 101"></path>
<path class="mo mo-smile" d="M89 128Q100 138 111 128"></path>
<path class="wh alt mo-open" d="M87 125H113Q113 142 100 142Q87 142 87 125Z"></path>
<path class="mo alt mo-flat" d="M92 132H108"></path>
<ellipse class="mo alt mo-o" cx="100" cy="132" rx="5" ry="6"></ellipse>
</g>
</g>
<g class="fx" aria-hidden="true">
<g class="fx-spark">
<g transform="translate(24 60)"><path class="sp gr" d="M0 -10C1 -3 3 -1 10 0C3 1 1 3 0 10C-1 3 -3 1 -10 0C-3 -1 -1 -3 0 -10Z"></path></g>
<g transform="translate(178 42)"><path class="sp sp2 gr" d="M0 -10C1 -3 3 -1 10 0C3 1 1 3 0 10C-1 3 -3 1 -10 0C-3 -1 -1 -3 0 -10Z"></path></g>
<g transform="translate(174 112) scale(.65)"><path class="sp sp3 gr" d="M0 -10C1 -3 3 -1 10 0C3 1 1 3 0 10C-1 3 -3 1 -10 0C-3 -1 -1 -3 0 -10Z"></path></g>
</g>
<g class="fx-dots">
<circle class="dt gy" cx="166" cy="46" r="4"></circle>
<circle class="dt d2 gy" cx="178" cy="31" r="5.5"></circle>
<circle class="dt d3 gy" cx="192" cy="14" r="7"></circle>
</g>
<g class="fx-badge">
<g class="bdg"><circle class="rd" cx="172" cy="40" r="16"></circle><path class="bx" d="M172 31V42"></path><circle class="wh" cx="172" cy="48.5" r="2.4"></circle></g>
</g>
</g>
</svg>
<div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
<div style="font-size: 17px; font-weight: 600; letter-spacing: -0.3px">{{item.title}}</div>
<div style="font-size: 14px; line-height: 1.4; color: #52525b">{{item.text}}</div>
</div>
</div>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":640}}'>
class Component extends DCLogic {
renderVals() {
return { rows: [
{ cls: 'm-joy', aria: 'Bystrouš se raduje', title: 'Zaplaceno', text: 'Novák s.r.o. poslal 48 200 Kč.' },
{ cls: 'm-think', aria: 'Bystrouš přemýšlí', title: 'Počítám cashflow', text: 'Výhled na 30 dní bude za chvilku.' },
{ cls: 'm-alert', aria: 'Bystrouš upozorňuje', title: 'Faktura po splatnosti', text: 'Mám připravit upomínku ke schválení?' }
] };
}
}
</script>
</body>
</html>
